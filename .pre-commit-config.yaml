repos:
  # Pytest - Unit tests for Python scripts
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests)
        entry: uv run --with pytest --with pytest-mock pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        files: \.py$

  # Skillsaw (stbenjam) - Plugin structure validation
  - repo: local
    hooks:
      - id: skillsaw-structure
        name: skillsaw (structure)
        entry: bash -c 'OUTPUT=$(uvx skillsaw 2>&1); echo "$OUTPUT"; echo "$OUTPUT" | sed "s/\x1b\[[0-9;]*m//g" | grep -q "^[[:space:]]*Errors:[[:space:]]*0"'
        language: system
        pass_filenames: false
        always_run: true

  # Claudelint (pdugan20) - Security and quality validation
  - repo: local
    hooks:
      - id: claudelint-quality
        name: claudelint (quality)
        entry: npx claude-code-lint check-all
        language: system
        pass_filenames: false
        always_run: true

  # Markdownlint - Markdown style checker
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.json', '--ignore-path', '.markdownlintignore']
